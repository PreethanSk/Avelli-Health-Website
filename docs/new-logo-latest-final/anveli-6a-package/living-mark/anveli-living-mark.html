<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>anveli · living mark</title>
<style>
html,body{margin:0;height:100%;background:#0B0C0D;color:#E9EEF0;font-family:ui-monospace,Menlo,monospace}
.stage{height:100%;display:grid;place-items:center;background:radial-gradient(120% 100% at 50% 100%,#14202A 0%,#0B0C0D 62%)}
svg{width:min(40vmin,260px);height:min(40vmin,260px);overflow:visible}
nav{position:fixed;left:0;right:0;bottom:28px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid #2E3E48;background:rgba(11,12,13,.6);color:#E9EEF0;cursor:pointer}
button[aria-pressed="true"]{background:#E9EEF0;color:#0B0C0D}
</style></head><body>
<div class="stage">
<svg viewBox="0 0 100 100" id="mark" role="img" aria-label="anveli">
<g fill="none" stroke="#E9EEF0" stroke-width="2.6"><circle cx="50" cy="81" r="9" opacity="0"/><circle cx="50" cy="71.5" r="18.5"/><circle cx="50" cy="61" r="29"/><circle cx="50" cy="50" r="40"/></g>
<circle cx="50" cy="81" r="9" fill="#9FD8E8"/>
</svg></div>
<nav><button data-m="breathe" aria-pressed="true">Idle · breathe</button><button data-m="sync">Syncing · accrue</button><button data-m="added">Record added · pulse</button></nav>
<script>
/* anveli living mark — drop-in. API: AnveliMark(svgEl).set('breathe'|'sync'|'added') */
function AnveliMark(svg){
  const rings=[...svg.querySelectorAll('g circle')], dot=svg.querySelector(':scope > circle');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let mode='breathe',t=0,tc=-9,ta=-9,snap=null,out=null,last=performance.now();
  const LV=[9,18.5,29,40,51];
  const b=k=>{k=Math.max(0,Math.min(1,k));return Math.sin(Math.PI*k)*(1-k*.3)};
  function target(){
    if(mode==='sync'){const p=(t*.55)%1,e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;return{r:[0,1,2,3].map(j=>LV[j]+(LV[j+1]-LV[j])*e),o:[e,1,1,1-e],d:9}}
    const r=[9,18.5+2.2*Math.sin(t*.9),29+2.6*Math.sin(t*.9-.9),40];let d=9+1.1*Math.sin(t*.9+.9);const u=t-ta;
    if(u<1.4){d+=5*b(u/.55);r[1]+=5*b((u-.08)/.6);r[2]+=4*b((u-.16)/.65);r[3]+=2.5*b((u-.24)/.7)}
    return{r,o:[0,1,1,1],d}}
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;if(!reduce)t+=dt;
    let g=target();const k=Math.min(1,(t-tc)/.5);
    if(snap&&k<1){const e=1-Math.pow(1-k,3),L=(a,c)=>a+(c-a)*e;g={r:g.r.map((v,i)=>L(snap.r[i],v)),o:g.o.map((v,i)=>L(snap.o[i],v)),d:L(snap.d,g.d)}}
    out=g;rings.forEach((c,i)=>{c.setAttribute('r',g.r[i].toFixed(2));c.setAttribute('cy',(90-g.r[i]).toFixed(2));c.setAttribute('opacity',g.o[i].toFixed(3))});
    dot.setAttribute('r',g.d.toFixed(2));dot.setAttribute('cy',(90-g.d).toFixed(2));
    if(mode==='added'&&t-ta>1.4)mode='breathe';
    requestAnimationFrame(frame)}
  requestAnimationFrame(frame);
  return{set(m){if(out){snap=JSON.parse(JSON.stringify(out));tc=t}if(m==='added'){ta=t;m='breathe'}mode=m},get mode(){return mode}};
}
const mark=AnveliMark(document.getElementById('mark'));
document.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{mark.set(btn.dataset.m);document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===btn&&btn.dataset.m!=='added'?'true':'false'));if(btn.dataset.m==='added')setTimeout(()=>document.querySelector('[data-m="breathe"]').setAttribute('aria-pressed','true'),10)});
</script></body></html>
